<main style="padding: 2rem; max-width: 600px; margin: 0 auto; font-family: system-ui, sans-serif;">
  <h1>{{ title() }}</h1>
  <p>{{ apiStatus() }}</p>

  <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
    <input
      type="text"
      [value]="newTaskTitle()"
      (input)="newTaskTitle.set($any($event.target).value)"
      (keydown.enter)="addTask()"
      placeholder="Escribe una tarea..."
      style="flex: 1; padding: 0.5rem; font-size: 1rem;"
    />
    <button
      (click)="addTask()"
      [disabled]="!newTaskTitle().trim()"
      style="padding: 0.5rem 1rem; font-size: 1rem;"
    >
      Agregar
    </button>
  </div>

  <ul style="list-style: none; padding: 0;">
    @for (task of tasks(); track task.id) {
      <li style="display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; border-bottom: 1px solid #eee;">
        <input
          type="checkbox"
          [checked]="task.done"
          (change)="toggleTask(task)"
        />
        <span [style.text-decoration]="task.done ? 'line-through' : 'none'">
          {{ task.title }}
        </span>
        <button
          (click)="deleteTask(task.id)"
          style="margin-left: auto; padding: 0.25rem 0.5rem; background: #ff4444; color: white; border: none; border-radius: 4px; cursor: pointer;"
        >
          Borrar
        </button>
      </li>
    } @empty {
      <li style="text-align: center; color: #888; padding: 2rem;">No hay tareas aún</li>
    }
  </ul>
</main>
